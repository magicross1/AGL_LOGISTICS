user www-data;
worker_processes auto;
pid /run/nginx.pid;

# 必需的事件模块配置
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # HTTP 强制跳转 HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name www.bsbtransport.com.au bsbtransport.com.au;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主配置
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.bsbtransport.com.au bsbtransport.com.au;
        
        # SSL 证书路径（确保文件存在）
        ssl_certificate /etc/nginx/ssl/bsb.cert;
        ssl_certificate_key /etc/nginx/ssl/bsb.key;
        
        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # 安全头
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # 主网站根目录
        root /var/www/bsbtransport/public;
        index index.html;

        # AGL favicon 精确匹配（最高优先级）
        location = /agl/agl-favicon.ico {
            alias /var/www/agl/public/agl-favicon.ico;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }
        
        # AGL favicon 根路径匹配（用于应用内引用）
        location = /agl-favicon.ico {
            alias /var/www/agl/public/agl-favicon.ico;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # AGL 静态资源处理（必须在 /agl/ 之前）
        location ~ ^/agl/_nuxt/(.*)$ {
            alias /var/www/agl/public/_nuxt/$1;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # AGL JS/MJS 文件特殊处理
        location ~ ^/agl/(.+\.(?:js|mjs))$ {
            alias /var/www/agl/public/$1;
            types { application/javascript js mjs; }
            default_type application/javascript;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # AGL 其他静态资源 (排除 favicon.ico，它有独立的精确匹配)
        location ~ ^/agl/(.+\.(?:css|png|jpg|jpeg|gif|webp|avif|svg|woff2?))$ {
            alias /var/www/agl/public/$1;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # AGL 子应用配置 - 独立目录（必须在主网站根路径之前）
        location /agl/ {
            alias /var/www/agl/public/;
            try_files $uri $uri/ /agl/200.html;
        }

        # 主网站静态资源缓存（必须在主网站根路径之前）
        location ~* ^/(?!agl/).*\.(?:js|mjs|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
            root /var/www/bsbtransport/public;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        # 主网站根路径处理（必须在最后）
        location / {
            root /var/www/bsbtransport/public;
            try_files $uri $uri/ /index.html;
        }
    }
}